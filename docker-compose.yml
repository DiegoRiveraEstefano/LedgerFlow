services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerflow} -d ${POSTGRES_DB:-ledgerflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ledgerflow-network

  redis:
    image: redis:7-alpine
    container_name: ledgerflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-ledgerflow_redis}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ledgerflow_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ledgerflow-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ledgerflow-network:
    driver: bridge
